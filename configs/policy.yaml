# Identity-driven alert policy — severity & suppression rules
# See instrunctions.md §8 for full specification

policy:
  time_rules:
    night_hours: [22, 6]        # UTC hours: 22:00 → 06:00

  intrusion:
    unknown_in_restricted: "HIGH"
    known_family_in_restricted: "LOW"
    suppress_known_roles:
      - OWNER
      - FAMILY
    enter_grace_s: 1.0

  loitering:
    threshold_s: 30
    escalate_unknown_only: false
    severity_unknown: "HIGH"
    severity_known: "LOW"
    cooldown_s: 60
    suppress_known_roles:
      - OWNER
      - FAMILY

  animals:
    known_pet: "SUPPRESS"
    unknown_animal_night: "MED"

  unknown_anomaly:
    max_alerts_per_interval: 2
    interval_s: 60
    suppress_if_known: true
    suppress_if_periodic: true
    suppress_if_illumination: true
