# Model Configuration — matches spec §1-§4
# Device and model settings for all detection lanes

device: "auto"          # auto | cuda | cpu

tensorrt:
  enabled: true
  fp16: true

models:
  # PRIMARY DETECTOR: RTDETRv2 (R101vd backbone, official checkpoint)
  # Uses native RTDETRv2 engine via torch.hub; falls back to Ultralytics .pt
  # Spec §2: COCO classes ONLY — do NOT produce fire/weapon from standard COCO model
  rt_detr:
    native_weights: "models/rtdetrv2_r101vd_6x_coco_from_paddle.pth"   # RTDETRv2 (new)
    hub_variant: "rtdetrv2_r101vd"                                      # architecture key
    weights: "rtdetr-l.pt"                                              # legacy fallback
    onnx_path: "models/rt_detr.onnx"
    trt_engine_path: "models/rt_detr.engine"
    score_threshold: 0.40                                               # tighter than 0.25 → fewer FPs
    class_allowlist: ["person", "car", "truck", "bus", "motorcycle", "bicycle"]
    use_fp16: true                                                      # FP16 on CUDA (30-50% speedup)
    use_compile: false                                                  # torch.compile (experimental)

  # FALLBACK DETECTOR: YOLOv8 (ultralytics)
  yolov8:
    weights: "models/yolov8n.pt"
    conf: 0.25

  # FIRE / SMOKE DETECTOR: dedicated model (spec §1)
  # NO FALLBACK — if weights missing, lane is DISABLED
  # Auto-downloads from HF on first run → renamed to models/fire_yolov8.pt
  fire_smoke:
    enabled: true
    weights: "models/fire_yolov8.pt"
    hf_repo_id: "SHOU-ISD/fire-and-smoke"
    hf_filename: "yolov8n.pt"             # downloaded then saved as fire_yolov8.pt
    conf: 0.38
    class_names: ["fire", "smoke"]        # configurable — must match model output classes
    # class_ids: [0, 1]                    # alternative: use integer ids directly
    min_area_px: 800
    min_area_ratio: 0.001
    min_persistence_hits: 2
    max_boxes_considered: 3
    fire_secondary_threshold: 0.55

  # WEAPON DETECTOR: dedicated model (spec §3C)
  # NO FALLBACK — if weights missing, lane is DISABLED
  # Auto-downloads from HF on first run → renamed to models/weapon_yolov8.pt
  weapon_yolo:
    enabled: true
    weights: "models/weapon_yolov8.pt"
    hf_repo_id: "Shantanukadam/weapon_detection"
    hf_filename: "All_weapon.pt"          # broad weapon coverage
    conf: 0.42
    class_names: ["gun", "knife", "weapon"]  # configurable — must match model output classes
    # class_ids: [0, 1, 2]                    # alternative: use integer ids directly

  # VIOLENCE CANDIDATE: cheap motion heuristic (spec §3A)
  violence_candidate:
    motion_threshold: 0.62
    candidate_hits: 3

  # ANOMALY DETECTION: AnyAnomaly (subprocess, official repo)
  # The entry_script is REQUIRED — worker will NOT guess.
  # Available scripts: vad_proposed_chatunivi.py, vad_proposed_MiniCPM.py, vad_proposed_Qwen_vllm.py
  # These are research evaluation scripts (require LLM weights + dataset structure).
  anyanomaly:
    enabled: true
    repo_dir: "third_party/Paper-AnyAnomaly"
    repo_url: "https://github.com/SkiddieAhn/Paper-AnyAnomaly.git"
    python_exe: ".venv_anyanomaly/Scripts/python.exe"
    entry_script: "vad_proposed_Qwen_vllm.py"      # explicit — no guessing
    entry_args_template: "--dataset=custom --type={events_csv}"
    sensitivity: 0.6
    prompt_template: "Detect abnormal events: {events}. Return anomaly score."
    events: ["fire", "smoke", "violence", "fight", "fall", "weapon", "intrusion"]
    max_clip_sec: 4
    clip_fps: 4
    candidate_threshold: 0.40
    model_path: "models/anyanomaly_ckpt.pth"

  # ANOMALY DETECTION LITE: AnomalyCLIP
  # No public checkpoint exists — stub mode is the expected default.
  # Set hf_repo_id + hf_filename when a deterministic checkpoint becomes available.
  anomalyclip:
    enabled: true
    sensitivity: 0.50
    model_path: "models/anomalyclip.pt"
    hf_repo_id: ""            # user must fill — no default public checkpoint
    hf_filename: ""

  # §4.2 — Motion gating config for AnomalyCLIP stub mode
  anomaly_stub:
    min_motion_area_ratio: 0.015       # suppress if motion occupies too little of frame
    max_global_change_ratio: 0.70     # suppress if entire frame changes (exposure/auto-gain)
    min_persistence_hits: 4           # require 4 of last 6 above threshold
    window_n: 6                       # persistence ring buffer size
    min_interval_s_between_alerts: 30 # prevent spam even if motion continues

  # TEMPORAL VERIFIER: X3D-S via PyTorchVideo TorchHub (on-demand only)
  # No local .pth required — loaded from TorchHub with pretrained weights.
  temporal_verifier:
    enabled: true
    kind: "x3d"
    source: "torchhub"                      # torchhub | local
    hub_repo: "facebookresearch/pytorchvideo"
    hub_model: "x3d_s"
    pretrained: true
    conf: 0.55
    model_path: "models/x3d_s.pth"          # fallback if source=local

  # PERSON DETECTOR (used by person_zone and fall_candidate)
  person_detector:
    kind: yolo
    weights: "models/yolov8n.pt"
    conf: 0.25
    classes: [0]

# GPU runtime budgets (spec addendum §2)
runtime:
  search_paths:
    - ".."              # parent of ai_module (auto-resolved relative to PROJECT_ROOT)
    - "./models"
    - "./third_party"
  gpu:
    max_queue: 128
    max_inflight: 4          # allow 4 concurrent GPU tasks (overlapping CUDA streams)
  budgets:
    rtdetr:
      max_latency_ms: 120
    fire_smoke:
      max_latency_ms: 150
    temporal_verifier:
      max_runs_per_cam_per_min: 30
    anyanomaly:
      max_runs_per_cam_per_min: 30
      drop_if_busy: true

# ── Identity subsystem ──────────────────────────────────────────────
identity:
  enabled: true

  face:
    provider: "insightface"
    model_pack: "buffalo_l"
    det_size: [640, 640]
    min_face_px: 60
    min_det_score: 0.65
    min_sharpness: 35.0            # Laplacian variance threshold
    max_abs_yaw: 35                # degrees; skip if unavailable
    max_abs_pitch: 25              # degrees; skip if unavailable
    match_threshold_sim: 0.50      # cosine similarity threshold
    top2_margin: 0.08              # best - second_best gap

  pet:
    enabled: true
    embedder: "clip"              # clip | color_histogram
    clip_model: "ViT-B-32"
    match_threshold_sim: 0.30
    top2_margin: 0.05
    min_pet_area_ratio: 0.01       # bbox_area / frame_area

  enrollment:
    min_images: 3
    max_embeddings_per_entity: 10
    outlier_reject_z: 2.5

  matcher:
    strategy: "topk_avg"           # max | centroid | topk_avg
    topk: 3

  runtime:
    sample_hz: 2
    track_cache_s: 5
    max_tracks_per_frame: 6
    history_L: 7
    accept_M: 3
    lock_s: 8
    unknown_grace_s: 6
    decay_per_s: 0.06
    reacquire_min_sim: 0.46
