worker_processes  1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # WebSocket connection upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8085;
        server_name _;

        # ── UI static files (Vite build output) ──────────────────
        root /usr/share/nginx/html;
        index index.html;

        # ── Django SSE (real-time notifications) ──────────────────
        location /api/notifications/stream/ {
            proxy_pass         http://${NGINX_BACKEND_UPSTREAM}/api/notifications/stream/;
            proxy_http_version 1.1;
            proxy_set_header   Connection         "";
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering    off;
            chunked_transfer_encoding on;
        }

        # ── Django REST API ───────────────────────────────────────
        location /api/ {
            proxy_pass         http://${NGINX_BACKEND_UPSTREAM}/api/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Django WebSocket (real-time notifications) ────────────
        location /ws/notifications/ {
            proxy_pass         http://${NGINX_BACKEND_UPSTREAM}/ws/notifications/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade            $http_upgrade;
            proxy_set_header   Connection         $connection_upgrade;
            proxy_set_header   Host               $host;
            proxy_set_header   X-Real-IP          $remote_addr;
            proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto  $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering    off;
        }

        # ── Django admin (optional) ──────────────────────────────
        location /admin/ {
            proxy_pass         http://${NGINX_BACKEND_UPSTREAM}/admin/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── AI WebSocket (internal use — UI uses polling via /api/ai/) ──
        location /ai/ws {
            set $ai_ws http://${NGINX_AI_UPSTREAM};
            proxy_pass         $ai_ws/ws;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── AI FastAPI (internal/debug — strip /ai/ prefix) ─────────
        location /ai/ {
            set $ai_http http://${NGINX_AI_UPSTREAM};
            rewrite ^/ai/(.*) /$1 break;
            proxy_pass         $ai_http;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── SPA fallback (React Router / wouter) ─────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
