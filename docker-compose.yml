version: "3.9"

services:
  # ── PostgreSQL canonical store ──────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-vigilzone}
      - POSTGRES_USER=${POSTGRES_USER:-vigilzone}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-vigilzone}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vigilzone} -d ${POSTGRES_DB:-vigilzone}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vigilzone
    restart: unless-stopped

  # ── Redis for Django Channels ────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - vigilzone
    restart: unless-stopped

  # ── Django REST API ─────────────────────────────────────────
  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-1}
      - DATABASE_URL=${DATABASE_URL:-postgresql://vigilzone:vigilzone@postgres:5432/vigilzone}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-only-change-me}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,backend,nginx}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:8085,http://localhost:3000}
      - AI_BASE_INTERNAL=${AI_BASE_INTERNAL:-http://ai:8080}
      - MEDIAMTX_API_URL=${MEDIAMTX_API_URL:-http://mediamtx:9997}
      - MEDIAMTX_INTERNAL_RTSP_URL=${MEDIAMTX_INTERNAL_RTSP_URL:-rtsp://mediamtx:8554}
      - AI_WEBHOOK_SECRET=${AI_WEBHOOK_SECRET:-vigilzone-webhook-secret}
      - AI_WEBHOOK_TOKEN=${AI_WEBHOOK_TOKEN:-}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://backend:8000}
      - CHANNEL_LAYER_BACKEND=${CHANNEL_LAYER_BACKEND:-redis}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_INCIDENT_CHANNEL=${AI_INCIDENT_CHANNEL:-vigilzone.ai.incidents}
      - MEDIAMTX_RTSP_BASE=${MEDIAMTX_RTSP_BASE:-rtsp://mediamtx:8554}
      - RELAY_RTSP_HOST=${RELAY_RTSP_HOST:-mediamtx}
      - RELAY_RTSP_PORT=${RELAY_RTSP_PORT:-8554}
      - STREAM_PREVIEW_PREFER_AI_SNAPSHOTS=${STREAM_PREVIEW_PREFER_AI_SNAPSHOTS:-1}
      - STREAM_PREVIEW_RTSP_FALLBACK_ENABLED=${STREAM_PREVIEW_RTSP_FALLBACK_ENABLED:-0}
      - STREAM_PREVIEW_AI_SNAPSHOT_TIMEOUT_SECONDS=${STREAM_PREVIEW_AI_SNAPSHOT_TIMEOUT_SECONDS:-2.0}
    depends_on:
      backend_migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1', 8000), 2); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - vigilzone
    restart: unless-stopped

  backend_migrate:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-1}
      - DATABASE_URL=${DATABASE_URL:-postgresql://vigilzone:vigilzone@postgres:5432/vigilzone}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-only-change-me}
      - CHANNEL_LAYER_BACKEND=${CHANNEL_LAYER_BACKEND:-redis}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_BASE_INTERNAL=${AI_BASE_INTERNAL:-http://ai:8080}
      - MEDIAMTX_API_URL=${MEDIAMTX_API_URL:-http://mediamtx:9997}
      - MEDIAMTX_INTERNAL_RTSP_URL=${MEDIAMTX_INTERNAL_RTSP_URL:-rtsp://mediamtx:8554}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vigilzone
    restart: "no"
    command: ["python", "manage.py", "migrate", "--noinput"]

  # ── MediaMTX RTSP server (optional relay for AI ingest) ─────
  # Browser preview does not depend on this service.
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    command: ["/mediamtx.yml"]
    ports:
      - "8554:8554"     # RTSP
      - "8889:8889"
      - "8888:8888"
      - "8189:8189/udp"
    environment:
      - MTX_PROTOCOLS=tcp
      - MTX_API=yes
      - MTX_APIADDRESS=:9997
      - MTX_WRITEQUEUESIZE=${MEDIAMTX_WRITE_QUEUE_SIZE:-2048}
      - MTX_READTIMEOUT=${MEDIAMTX_READ_TIMEOUT:-60s}
      - MTX_WRITETIMEOUT=${MEDIAMTX_WRITE_TIMEOUT:-30s}
      - MTX_WEBRTCADDITIONALHOSTS=${MTX_WEBRTCADDITIONALHOSTS:-}
    volumes:
      - ./deploy/mediamtx/mediamtx.yml:/mediamtx.yml:ro
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    networks:
      - vigilzone
    restart: unless-stopped

  # ── Webcam → RTSP publisher ─────────────────────────────────
  # Linux: captures /dev/video0 with v4l2 and publishes to MediaMTX.
  # Fallback: generates an SMPTE test pattern if no webcam is available.
  webcam_publisher:
    build:
      context: ./services/webcam_publisher
      dockerfile: Dockerfile
    depends_on:
      - mediamtx
    devices:
      - /dev/video0:/dev/video0   # Linux host webcam (ignored if absent)
    environment:
      - RTSP_TARGET=rtsp://mediamtx:8554/webcam
      - INPUT_DEVICE=/dev/video0
      - FALLBACK_MODE=${WEBCAM_FALLBACK:-testsrc}
    networks:
      - vigilzone
    restart: unless-stopped

  # ── AI FastAPI microservice ─────────────────────────────────
  ai:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ai-evidence:/app/evidence
      - ai-data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - AI_API_PORT=${AI_API_PORT:-8080}
      - AI_PUBLIC_BASE_URL=${AI_PUBLIC_BASE_URL:-http://ai:8080}
      - BACKEND_BASE_INTERNAL=${BACKEND_BASE_INTERNAL:-http://backend:8000}
      - BACKEND_CONFIG_SYNC_BASE=${BACKEND_CONFIG_SYNC_BASE:-http://backend:8000/api/ai/internal}
      - AI_CONFIG_SNAPSHOT_MODE=${AI_CONFIG_SNAPSHOT_MODE:-backend_only}
      - AI_WEBHOOK_SECRET=${AI_WEBHOOK_SECRET:-vigilzone-webhook-secret}
      - AI_WEBHOOK_TOKEN=${AI_WEBHOOK_TOKEN:-}
      - AI_USE_REDIS_PUBLISH=${AI_USE_REDIS_PUBLISH:-1}
      - AI_REDIS_URL=${AI_REDIS_URL:-redis://redis:6379/0}
      - AI_REDIS_HOST=redis
      - AI_REDIS_PORT=6379
      - AI_INCIDENT_CHANNEL=${AI_INCIDENT_CHANNEL:-vigilzone.ai.incidents}
      - MEDIAMTX_INTERNAL_RTSP_URL=${MEDIAMTX_INTERNAL_RTSP_URL:-rtsp://mediamtx:8554}
      - AI_EVIDENCE_DIR=/app/evidence
      - AI_DATA_DIR=/app/data
      - AI_STAGING_DIR=/app/data/staging_uploads
      - AI_ENROLL_IMAGE_DIR=/app/data/enroll_images
      - AI_CORS_ALLOWED_ORIGINS=${AI_CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      backend_migrate:
        condition: service_completed_successfully
    networks:
      - vigilzone
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 10

  outbox_publisher:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-1}
      - DATABASE_URL=${DATABASE_URL:-postgresql://vigilzone:vigilzone@postgres:5432/vigilzone}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-only-change-me}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_INCIDENT_CHANNEL=${AI_INCIDENT_CHANNEL:-vigilzone.ai.incidents}
    depends_on:
      backend_migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vigilzone
    restart: unless-stopped
    command: ["python", "manage.py", "outbox_stream_publisher"]

  entity_embedding_worker:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-1}
      - DATABASE_URL=${DATABASE_URL:-postgresql://vigilzone:vigilzone@postgres:5432/vigilzone}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-only-change-me}
      - AI_BASE_INTERNAL=${AI_BASE_INTERNAL:-http://ai:8080}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      backend_migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      ai:
        condition: service_healthy
    networks:
      - vigilzone
    restart: unless-stopped
    command: ["python", "manage.py", "process_entity_embeddings"]

  relay_reconciler:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-1}
      - DATABASE_URL=${DATABASE_URL:-postgresql://vigilzone:vigilzone@postgres:5432/vigilzone}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-only-change-me}
      - MEDIAMTX_API_URL=${MEDIAMTX_API_URL:-http://mediamtx:9997}
      - MEDIAMTX_INTERNAL_RTSP_URL=${MEDIAMTX_INTERNAL_RTSP_URL:-rtsp://mediamtx:8554}
      - RELAY_RTSP_HOST=${RELAY_RTSP_HOST:-mediamtx}
      - RELAY_RTSP_PORT=${RELAY_RTSP_PORT:-8554}
    depends_on:
      backend_migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
      mediamtx:
        condition: service_started
    networks:
      - vigilzone
    restart: unless-stopped
    command: ["python", "manage.py", "run_relay_reconciler"]

  # ── Backend Redis incident subscriber ───────────────────────
  incident_subscriber:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-1}
      - DATABASE_URL=${DATABASE_URL:-postgresql://vigilzone:vigilzone@postgres:5432/vigilzone}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-only-change-me}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AI_INCIDENT_CHANNEL=${AI_INCIDENT_CHANNEL:-vigilzone.ai.incidents}
      - AI_BASE_INTERNAL=${AI_BASE_INTERNAL:-http://ai:8080}
      - MEDIAMTX_API_URL=${MEDIAMTX_API_URL:-http://mediamtx:9997}
      - MEDIAMTX_INTERNAL_RTSP_URL=${MEDIAMTX_INTERNAL_RTSP_URL:-rtsp://mediamtx:8554}
    depends_on:
      backend_migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - vigilzone
    restart: unless-stopped
    command: ["python", "manage.py", "subscribe_incidents"]

  # ── Nginx reverse proxy + UI static files ───────────────────
  nginx:
    build:
      context: .
      dockerfile: web/ui/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_ENABLE_WEBRTC: ${VITE_ENABLE_WEBRTC:-false}
        VITE_WEBRTC_VIEWER_BASE_URL: ${VITE_WEBRTC_VIEWER_BASE_URL:-}
        VITE_HLS_VIEWER_BASE_URL: ${VITE_HLS_VIEWER_BASE_URL:-}
        VITE_ALLOW_LOOPBACK_WEBRTC_ON_WINDOWS: ${VITE_ALLOW_LOOPBACK_WEBRTC_ON_WINDOWS:-false}
        VITE_ENABLE_MEDIAMTX_API_HEALTHCHECK: ${VITE_ENABLE_MEDIAMTX_API_HEALTHCHECK:-true}
    ports:
      - "8085:8085"
    environment:
      - NGINX_BACKEND_UPSTREAM=${NGINX_BACKEND_UPSTREAM:-backend:8000}
      - NGINX_AI_UPSTREAM=${NGINX_AI_UPSTREAM:-ai:8080}
    depends_on:
      backend_migrate:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
      ai:
        condition: service_healthy
    networks:
      - vigilzone
    restart: unless-stopped

volumes:
  postgres-data:
  ai-evidence:
  ai-data:
  redis-data:

networks:
  vigilzone:
    driver: bridge
