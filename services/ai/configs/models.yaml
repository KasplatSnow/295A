# Model Configuration — matches spec §1-§4
# Device and model settings for all detection lanes

device: "auto"          # auto | cuda | cpu

tensorrt:
  enabled: true
  fp16: true

models:
  # PRIMARY DETECTOR: RTDETRv2 (R101vd backbone, official checkpoint)
  # Uses native RTDETRv2 engine via torch.hub; falls back to Ultralytics .pt
  # Spec §2: COCO classes ONLY — do NOT produce fire/weapon from standard COCO model
  rt_detr:
    native_weights: "models/rtdetrv2_r101vd_6x_coco_from_paddle.pth"   # RTDETRv2 (new)
    hub_variant: "rtdetrv2_r101vd"                                      # architecture key
    weights: "models/rtdetr-l.pt"                                        # legacy fallback
    onnx_path: "models/rt_detr.onnx"
    trt_engine_path: "models/rt_detr.engine"
    score_threshold: 0.40                                               # tighter than 0.25 → fewer FPs
    class_allowlist: ["person", "car", "truck", "bus", "motorcycle", "bicycle"]
    use_fp16: true                                                      # FP16 on CUDA (30-50% speedup)
    use_compile: false                                                  # torch.compile (experimental)

  # FALLBACK DETECTOR: YOLOv8 (ultralytics)
  yolov8:
    weights: "models/yolov8n.pt"
    conf: 0.25

  # POSE ESTIMATION: YOLOv8-Pose (pretrained, plug-and-play)
  # Provides per-person keypoints consumed by fall_candidate lane.
  yolo_pose:
    enabled: true
    weights: "models/yolov8n-pose.pt"
    conf: 0.25
    kpt_conf: 0.30

  # FALL DETECTION: Pose-based multi-factor scoring
  # Used by fall_candidate lane for torso angle / hip drop / stillness analysis.
  fall:
    enabled: true
    angle_thresh_deg: 35
    hip_drop_thresh: 0.20
    persist_s: 1.0
    still_s: 1.2
    still_vel_thresh: 8.0
    min_pose_conf: 0.35

  # FIRE / SMOKE DETECTOR: dedicated model (spec §1)
  # NO FALLBACK — if weights missing, lane is DISABLED
  # Auto-downloads from HF on first run → renamed to models/fire_yolov8.pt
  fire_smoke:
    enabled: true
    weights: "models/fire_yolov8.pt"
    hf_repo_id: "SHOU-ISD/fire-and-smoke"
    hf_filename: "yolov8n.pt"             # downloaded then saved as fire_yolov8.pt
    conf: 0.38
    class_names: ["fire", "smoke"]        # configurable — must match model output classes
    # class_ids: [0, 1]                    # alternative: use integer ids directly
    min_area_px: 800
    min_area_ratio: 0.001
    min_persistence_hits: 4               # updated: 4/8 persistence
    persistence_window: 10
    max_boxes_considered: 3
    fire_secondary_threshold: 0.65
    min_aspect_ratio: 0.125               # reject extreme aspect ratios
    max_aspect_ratio: 8.0
    flicker_min_hits: 4                   # spatial persistence across frames
    weights_source: "hf"                  # "hf" or "luminous0219"

  # WEAPON DETECTOR: dedicated model (spec §3C)
  # NO FALLBACK — if weights missing, lane is DISABLED
  # Auto-downloads from HF on first run → renamed to models/weapon_yolov8.pt
  weapon_yolo:
    enabled: true
    weights: "models/weapon_yolov8.pt"
    hf_repo_id: "Shantanukadam/weapon_detection"
    hf_filename: "All_weapon.pt"          # broad weapon coverage
    conf: 0.42
    class_names: ["gun", "knife", "weapon"]  # configurable — must match model output classes
    # class_ids: [0, 1, 2]                    # alternative: use integer ids directly
    proximity_required: true               # weapon must be near a person
    proximity_thresh_px: 200               # max distance weapon→person bbox
    hand_proximity_thresh_px: 100          # max distance weapon→hand keypoints
    persistence_k: 3
    persistence_n: 5

  # VIOLENCE CANDIDATE: person-centric proximity + local motion (spec §4)
  violence_candidate:
    motion_threshold: 0.60
    candidate_hits: 3
    proximity_thresh_px: 200          # max distance between person bboxes
    min_persons: 2                     # minimum persons in proximity group
    local_motion_weight: 0.50
    global_motion_weight: 0.30
    proximity_weight: 0.20
    spike_boost: 0.15

  # INTRUSION: boundary crossing detection (spec §2)
  intrusion:
    enter_grace_s: 1.0                # grace period for zone edge transitions
    min_confidence: 0.40

  # LOITERING: dwell time detection (spec §2)
  loitering:
    enabled: true
    threshold_s: 30.0                  # seconds before loitering alert
    escalate_unknown_only: false       # only escalate severity for unknown persons
    cooldown_s: 60                     # per-track loitering cooldown

  # ACCIDENT: traffic crash detection stub (spec §7)
  accident:
    enabled: false                     # only enable for traffic cameras
    sudden_stop_threshold: 0.6
    weights: ""                        # path to crash model when available

  # ANOMALY DETECTION: AnyAnomaly (subprocess, official repo)
  # The entry_script is REQUIRED — worker will NOT guess.
  # Available scripts: vad_proposed_chatunivi.py, vad_proposed_MiniCPM.py, vad_proposed_Qwen_vllm.py
  # These are research evaluation scripts (require LLM weights + dataset structure).
  anyanomaly:
    enabled: true
    repo_dir: "third_party/Paper-AnyAnomaly"
    repo_url: "https://github.com/SkiddieAhn/Paper-AnyAnomaly.git"
    python_exe: "C:\\Users\\devan\\OneDrive\\Desktop\\yolov12-cls\\.venv\\Scripts\\python.exe"
    entry_script: "vad_proposed_MiniCPM.py"
    entry_args_template: "--dataset=custom --type={events_csv}"
    sensitivity: 0.6
    prompt_template: "Detect abnormal events: {events}. Return anomaly score."
    events: ["fire", "smoke", "violence", "fight", "fall", "weapon", "intrusion"]
    max_clip_sec: 4
    clip_fps: 4
    candidate_threshold: 0.40
    model_path: "MiniCPM-V-2_6-int4"

  # ANOMALY DETECTION LITE: AnomalyCLIP
  # No public checkpoint exists — stub mode is the expected default.
  # Set hf_repo_id + hf_filename when a deterministic checkpoint becomes available.
  anomalyclip:
    enabled: true
    sensitivity: 0.50
    model_path: "models/anomalyclip.pt"
    hf_repo_id: ""            # user must fill — no default public checkpoint
    hf_filename: ""

  # §4.2 — Motion gating config for AnomalyCLIP stub mode
  anomaly_stub:
    min_motion_area_ratio: 0.015       # suppress if motion occupies too little of frame
    max_global_change_ratio: 0.70     # suppress if entire frame changes (exposure/auto-gain)
    min_persistence_hits: 4           # require 4 of last 6 above threshold
    window_n: 6                       # persistence ring buffer size
    min_interval_s_between_alerts: 30 # prevent spam even if motion continues

  # TEMPORAL VERIFIER: X3D-S via PyTorchVideo TorchHub (on-demand only)
  # No local .pth required — loaded from TorchHub with pretrained weights.
  temporal_verifier:
    enabled: true
    kind: "x3d"
    source: "torchhub"                      # torchhub | local
    hub_repo: "facebookresearch/pytorchvideo"
    hub_model: "x3d_s"
    pretrained: true
    conf: 0.55
    model_path: "models/x3d_s.pth"          # fallback if source=local

  # PERSON DETECTOR (used by person_zone and fall_candidate)
  person_detector:
    kind: yolo
    weights: "models/yolov8n.pt"
    conf: 0.25
    classes: [0]
  # ── AUDIO ANOMALY: BEATs (Microsoft) — PR-03 ──────────────────────────────
  # SOTA audio event detection using BEATs_iter3+ AS2M fine-tuned checkpoint.
  # Default: disabled. Enable per-camera via modality_mode: video_audio | audio_only.
  # Auto-download: doctor.py fetches source files + checkpoint on first startup
  #                when enabled=true (see AI_BEATS_HF_REPO_ID env var to override).
  audio_anomaly:
    enabled: true                  # set true to activate; doctor.py will auto-fetch assets
    backend: beats
    device: auto                    # auto | cuda | cpu
    fp16: true                      # FP16 on CUDA only (safe fallback to FP32)
    model_path: "models/audio/beats/BEATs_iter3_plus_AS2M_finetuned_cpt2.pt"
    hf_repo_id: "agkphysics/AudioSet-BEATs"
    hf_filename: "BEATs_iter3_plus_AS2M_finetuned_cpt2.pt"
    ensemble_model_paths: []        # optional: list additional .pt paths for ensemble
    sample_rate: 16000
    chunk_s: 1.0                    # chunk duration fed to BEATs
    hop_s: 0.5                      # hop between chunks (< chunk_s → overlap)
    top_k: 10                       # top-K AudioSet labels to map
    min_raw_score: 0.15             # discard predictions below this before mapping
    min_canonical_score: 0.50       # canonical label must exceed this to be considered
    alert_labels:                   # canonical_label: alert_threshold
      audio_scream: 0.70
      audio_shout: 0.75
      audio_gunshot: 0.80
      audio_explosion: 0.80
      audio_glass_break: 0.65
      audio_siren: 0.75
      audio_alarm: 0.70
      audio_vehicle_crash: 0.75
    smoothing:
      enabled: true
      window_s: 3.0                 # temporal smoothing window in seconds
      method: max_then_ema          # max over window, then EMA
      ema_alpha: 0.45

  # ── MULTIMODAL FUSION: audio + video — PR-04 ───────────────────────────────
  # Deterministic rule-based fusion of audio and video Observations.
  # Added here for completeness; implemented in PR-04.
  video_audio_fusion:
    enabled: true                  # activated in PR-04
    window_s: 10.0                  # temporal window to correlate audio + video events
    audio_weight: 0.45
    video_weight: 0.55
    synergy_bonus_confirmed: 0.12   # bonus when both modalities agree
    conflict_penalty: 0.10          # penalty when modalities conflict
    fused_alert_threshold: 0.72
    high_severity_threshold: 0.85
    allow_audio_only_high_risk: true   # emit alert for gunshot/explosion even without video
    allow_video_only_passthrough: true # video alerts still pass when audio is absent
    uncertainty_threshold: 0.6         # Phase 2: max allowed uncertainty for audio
    normality_ema_alpha: 0.05          # Phase 2: EMA alpha for background noise normality
    learned_fusion_mode: shadow        # Phase 2: off | shadow | active
    learned_fusion_checkpoint: ""      # Phase 2: optional path to .pt file
    cooldown_s:
      audio_scream_person: 30
      gunshot_audio_only: 60
      explosion_audio_only: 60
      glass_break_intrusion: 60
      alarm_fire: 60
      generic_multimodal: 30

runtime:
  search_paths:
    - "./models"        # all weights live here
    - "./third_party"
  gpu:
    max_queue: 32
    max_inflight: 2          # allow 2 concurrent GPU tasks (overlapping CUDA streams)
  budgets:
    rtdetr:
      max_latency_ms: 120
    fire_smoke:
      max_latency_ms: 150
    temporal_verifier:
      max_runs_per_cam_per_min: 30
    anyanomaly:
      max_runs_per_cam_per_min: 30
      drop_if_busy: true

# ── Identity subsystem ──────────────────────────────────────────────
identity:
  enabled: true

  face:
    provider: "insightface"
    model_pack: "buffalo_l"
    det_size: [640, 640]
    min_face_px: 60
    min_det_score: 0.65
    min_sharpness: 35.0            # Laplacian variance threshold
    max_abs_yaw: 35                # degrees; skip if unavailable
    max_abs_pitch: 25              # degrees; skip if unavailable
    match_threshold_sim: 0.50      # cosine similarity threshold
    top2_margin: 0.08              # best - second_best gap

  pet:
    enabled: true
    embedder: "clip"              # clip | color_histogram
    clip_model: "ViT-B-32"
    match_threshold_sim: 0.30
    top2_margin: 0.05
    min_pet_area_ratio: 0.01       # bbox_area / frame_area

  enrollment:
    min_images: 3
    max_embeddings_per_entity: 10
    outlier_reject_z: 2.5

  matcher:
    strategy: "topk_avg"           # max | centroid | topk_avg
    topk: 3

  runtime:
    sample_hz: 2
    track_cache_s: 5
    max_tracks_per_frame: 6
    history_L: 7
    accept_M: 3
    lock_s: 8
    unknown_grace_s: 6
    decay_per_s: 0.06
    reacquire_min_sim: 0.46
